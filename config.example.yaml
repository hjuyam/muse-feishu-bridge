# 复制为 config.yaml 后填写。真实密钥只进 config.yaml 或环境变量，绝不提交到仓库。
# 环境变量 FEISHU_APP_ID / FEISHU_APP_SECRET 会覆盖这里的值。

feishu:
  app_id: "cli_xxxxxxxxxxxxxxxx"   # 飞书开放平台 → 你的应用 → 凭证与基础信息
  app_secret: ""                   # 留空则必须用环境变量 FEISHU_APP_SECRET 提供

bridge:
  # 收件箱位置：长连接收到的消息以 JSONL 追加到这里；hook 每 30 秒检测到新消息才唤醒 Muse
  inbox_path: "./data/inbox.jsonl"
  # 白名单：只处理这些 open_id 发来的消息（在飞书里点自己头像可看到 open_id，
  # 或先留空跑 doctor 看日志）。留空列表 = 不限制（不推荐）。
  allow_open_ids: []
